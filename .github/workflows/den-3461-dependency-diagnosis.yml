name: DEN-3461 dependency diagnosis

on:
  push:
    branches:
      - agent/den-3461-domain-scoped-indexing

permissions:
  contents: read

concurrency:
  group: den-3461-dependency-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invert:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - name: Show the exact tinyvec dependency and feature chain
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -i tinyvec -e features
          cargo tree -i unicode-normalization -e features || true
          cargo tree -i idna_adapter -e features || true
