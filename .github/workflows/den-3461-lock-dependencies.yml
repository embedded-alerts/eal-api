name: DEN-3461 lock server dependencies

on:
  push:
    branches:
      - agent/den-3461-domain-scoped-indexing

permissions:
  contents: write

concurrency:
  group: den-3461-lock-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Generate the application lock and select the last published TinyVec release
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo update -p tinyvec --precise 1.12.0
          cargo tree --locked -i tinyvec -e features
          test "$(awk '
            $0 == "name = \"tinyvec\"" { in_tinyvec=1; next }
            in_tinyvec && /^version = / { gsub(/version = |\"/, ""); print; exit }
          ' Cargo.lock)" = "1.12.0"

      - name: Prove the locked server graph at the repository MSRV
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release

      - name: Remove temporary diagnostic workflows and verify the final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -- \
            .github/workflows/den-3461-dependency-diagnosis.yml \
            .github/workflows/den-3461-lock-dependencies.yml
          git diff --check
          git status --short | awk '{print $2}' | LC_ALL=C sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/den-3461-dependency-diagnosis.yml
          .github/workflows/den-3461-lock-dependencies.yml
          Cargo.lock
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

      - name: Commit only the reviewed lockfile result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/den-3461-dependency-diagnosis.yml \
            .github/workflows/den-3461-lock-dependencies.yml \
            Cargo.lock
          git commit -m 'fix(DEN-3461): lock the API dependency graph'
          git push origin "HEAD:${GITHUB_REF_NAME}"
